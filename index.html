<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Text Editor</title>
<style>
  :root {
    --bg: #f5f6f8;
    --editor-bg: #ffffff;
    --toolbar-bg: #ffffff;
    --text: #1e2229;
    --muted: #6b7280;
    --border: #e2e5ea;
    --accent: #3b82f6;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 14px rgba(0,0,0,.05);
  }

  body.dark {
    --bg: #12141a;
    --editor-bg: #1a1d24;
    --toolbar-bg: #1e222b;
    --text: #e5e8ee;
    --muted: #8b93a3;
    --border: #2c313c;
    --accent: #60a5fa;
    --shadow: 0 1px 3px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    transition: background .25s ease, color .25s ease;
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    padding: 10px 18px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    transition: background .25s ease, border-color .25s ease;
  }

  .toolbar .brand {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: .3px;
    margin-right: 6px;
    white-space: nowrap;
  }

  .toolbar .brand span { color: var(--accent); }

  .control {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .control label {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  select, button {
    font: inherit;
    color: var(--text);
    background: var(--editor-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
    transition: border-color .15s ease, background .25s ease;
  }

  select:hover, button:hover { border-color: var(--accent); }

  select:focus, button:focus, .editor:focus { outline: none; }

  /* Formatting buttons */
  .fmt-btn {
    min-width: 34px;
    padding: 6px 9px;
    font-size: 14px;
  }

  .fmt-btn.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, var(--editor-bg));
  }

  .fmt-btn.b { font-weight: 700; }
  .fmt-btn.i { font-style: italic; font-family: Georgia, serif; }
  .fmt-btn.u { text-decoration: underline; }
  .fmt-btn.s { text-decoration: line-through; font-weight: 600; }

  /* Color buttons */
  .color-btn {
    position: relative;
    padding-bottom: 10px;
  }

  .color-btn .swatch {
    position: absolute;
    left: 7px;
    right: 7px;
    bottom: 4px;
    height: 4px;
    border-radius: 2px;
    background: #e11d48;
  }

  .color-btn .hl-chip {
    padding: 0 3px;
    border-radius: 3px;
    background: #fde047;
  }

  /* Custom color panel (replaces the native picker) */
  .color-panel {
    position: fixed;
    z-index: 100;
    width: 288px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 12px;
  }

  .color-panel .swatch-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 4px;
  }

  .color-panel .cell {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid rgba(128,128,128,.25);
    transition: transform .08s ease;
  }

  .color-panel .cell:hover { transform: scale(1.2); }

  .color-panel .cell.selected {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .panel-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .panel-preview {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .preview-chip {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #e11d48;
  }

  .panel-footer input[type="color"] {
    width: 36px;
    height: 30px;
    padding: 2px;
    border-radius: 6px;
  }

  .panel-footer button { font-size: 12.5px; padding: 6px 12px; }

  .apply-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .apply-btn:disabled { opacity: .45; cursor: default; }

  .panel-hint {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* ---------- Find & Replace panel ---------- */
  .find-panel {
    position: fixed;
    z-index: 120;
    top: 64px;
    right: 18px;
    width: 340px;
    background: var(--toolbar-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .find-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .find-close {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 0 4px;
  }

  .find-close:hover { color: var(--accent); }

  .find-row { display: flex; gap: 6px; align-items: center; }

  .find-panel input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--editor-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 9px;
  }

  .find-panel input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .find-count { font-size: 11.5px; color: var(--muted); white-space: nowrap; min-width: 34px; text-align: center; }

  .find-nav-btn, .find-act-btn {
    font: inherit;
    font-size: 12.5px;
    color: var(--text);
    background: var(--editor-bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 9px;
    cursor: pointer;
    white-space: nowrap;
  }

  .find-nav-btn:hover, .find-act-btn:hover { border-color: var(--accent); }

  .find-act-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .find-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--muted);
  }

  .find-meta label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

  mark.find-hl {
    background: color-mix(in srgb, #f59e0b 42%, transparent);
    color: inherit;
    border-radius: 2px;
    padding: 0 1px;
  }

  mark.find-hl.active {
    background: #f59e0b;
    color: #1e2229;
    box-shadow: 0 0 0 2px color-mix(in srgb, #f59e0b 55%, transparent);
  }

  .align-btn svg { display: block; }
  .align-btn:hover svg line { stroke: var(--accent); }

  .undo-btn {
    min-width: 34px;
    padding: 4px 8px;
    display: flex;
    align-items: center;
  }

  .undo-btn svg { display: block; }
  .undo-btn:hover svg { stroke: var(--accent); }

  .undo-btn:disabled { opacity: .35; cursor: default; }

  .divider {
    width: 1px;
    height: 22px;
    background: var(--border);
  }

  .download-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 6px 12px;
  }

  .download-btn.armed {
    border-color: #ef4444;
    color: #ef4444;
    font-weight: 600;
  }

  .panes-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    padding: 6px 10px;
  }

  .panes-btn.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, var(--editor-bg));
  }

  .panes-btn .count {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--accent);
  }

  .scan-btn {
    font-size: 12.5px;
    padding: 6px 9px;
    color: var(--muted);
  }

  .scan-btn.scanned { color: var(--accent); font-weight: 600; }

  /* Font scan can take a long time on giant libraries — show the hourglass
     over the whole page so it doesn't look like the app hung */
  body.fontscan-busy,
  body.fontscan-busy * {
    cursor: wait !important;
  }

  /* Blinking "Loading" pill — floats over the bottom-LEFT corner of the editor
     (opposite the counts pill), reserving no toolbar or editor layout space.
     Shown during the async font scan; a native <select> can't paint its own
     busy state while its popup modal loop is open, so we surface it here. */
  .loading-ind {
    display: none;
    position: absolute;
    left: 34px;
    bottom: 34px;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    background: color-mix(in srgb, var(--editor-bg) 82%, transparent);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none;
    user-select: none;
    z-index: 5;
  }

  .loading-ind.show {
    display: inline-flex;
    animation: loadBlink 1s ease-in-out infinite;
  }

  @keyframes loadBlink {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-ind.show { animation: none; opacity: 1; }
  }

  /* Font size slider */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 150px;
    height: 5px;
    border-radius: 3px;
    background: var(--border);
    cursor: pointer;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

  input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

  .size-value {
    min-width: 42px;
    text-align: center;
    font-size: 12.5px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 6px;
  }

  .spacer { flex: 1; }

  /* Theme toggle */
  .theme-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    padding: 6px 12px;
  }

  .theme-btn .icon { font-size: 15px; line-height: 1; }

  .status {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* ---------- Editor ---------- */
  .editor-wrap {
    flex: 1;
    display: flex;
    position: relative; /* anchor for the floating counts overlay */
    padding: 22px;
    min-height: 0;
  }

  .editor {
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--editor-bg);
    color: var(--text);
    padding: 22px 26px 48px; /* extra bottom room so text clears the floating counts */
    scroll-padding-bottom: 40px;
    line-height: 1.65;
    box-shadow: var(--shadow);
    transition: background .25s ease, color .25s ease, border-color .25s ease;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .editor:focus { border-color: var(--accent); }

  /* Multi-pane mode: fixed height, columns fill top-to-bottom then flow right */
  .editor.multi {
    column-fill: auto;
    column-gap: 34px;
    column-rule: 1px solid var(--border);
    overflow-x: auto;
    overflow-y: hidden;
    height: 100%;
  }

  .editor:empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    opacity: .6;
  }

  /* Word highlight (double-click) — pulses while active so all occurrences are easy to spot */
  mark.word-hl {
    background: color-mix(in srgb, var(--accent) 32%, transparent);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
    animation: hlBlink 1.1s ease-in-out infinite;
  }

  @keyframes hlBlink {
    0%, 100% {
      background: color-mix(in srgb, var(--accent) 22%, transparent);
    }
    50% {
      background: color-mix(in srgb, var(--accent) 88%, transparent);
      color: #ffffff;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    mark.word-hl { animation: none; }
  }

  /* ---------- Floating counts: overlay pill, reserves NO editor height ---------- */
  .statusbar {
    position: absolute;
    right: 34px;
    bottom: 34px;
    display: flex;
    justify-content: flex-end;
    gap: 18px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--muted);
    background: color-mix(in srgb, var(--editor-bg) 82%, transparent);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    pointer-events: none; /* clicks pass straight through to the editor */
    user-select: none;
    transition: background .25s ease, border-color .25s ease;
  }

  .statusbar span { font-variant-numeric: tabular-nums; }

  @media (max-width: 720px) {
    .toolbar { gap: 12px; padding: 8px 12px; }
    input[type="range"] { width: 100px; }
    .editor-wrap { padding: 12px; }
  }

  /* ---------- Print: only the document, on paper-friendly styling ---------- */
  @media print {
    .toolbar, .statusbar, .color-panel, .loading-ind, .find-panel { display: none !important; }

    body {
      display: block;
      height: auto;
      background: #ffffff !important;
    }

    .editor-wrap { display: block; padding: 0; }

    .editor {
      height: auto !important;
      overflow: visible !important;
      column-count: auto !important; /* panes flow back into normal pages */
      border: none;
      box-shadow: none;
      background: #ffffff !important;
      color: #000000;
    }

    /* Night theme must not bleed onto paper: force black text where the user
       didn't apply an explicit color */
    body.dark .editor { color: #000000; }

    /* Search highlights are screen-only aids */
    mark.word-hl, mark.find-hl {
      background: transparent !important;
      color: inherit !important;
      animation: none !important;
      padding: 0;
    }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <div class="brand">✎ Simple<span>Editor</span></div>

    <div class="control">
      <label for="fontFamily">Font</label>
      <select id="fontFamily">
        <option value="Segoe UI, system-ui, sans-serif">Segoe UI</option>
        <option value="Arial, Helvetica, sans-serif">Arial</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Consolas, 'Cascadia Code', monospace">Consolas</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="Tahoma, sans-serif">Tahoma</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        <option value="cursive">Comic / Cursive</option>
      </select>
      <button class="scan-btn" id="scanFontsBtn" title="Load all fonts installed on this computer into the list">🔤 System</button>
    </div>

    <div class="control">
      <label for="fontSize">Size</label>
      <input type="range" id="fontSize" min="10" max="48" step="1" value="18">
      <span class="size-value" id="sizeValue">18px</span>
    </div>

    <div class="divider"></div>

    <div class="control">
      <button class="undo-btn" id="undoBtn" title="Back / Undo (Ctrl+Z)" style="border:1px solid var(--border);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>
        </svg>
      </button>
      <button class="undo-btn" id="redoBtn" title="Redo (Ctrl+Y)" style="border:1px solid var(--border);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/>
        </svg>
      </button>
    </div>

    <div class="control">
      <button class="fmt-btn b" id="boldBtn" title="Bold (Ctrl+B)">B</button>
      <button class="fmt-btn i" id="italicBtn" title="Italic (Ctrl+I)">I</button>
      <button class="fmt-btn u" id="underlineBtn" title="Underline (Ctrl+U)">U</button>
      <button class="fmt-btn s" id="strikeBtn" title="Strikethrough">S</button>
      <button class="fmt-btn color-btn" id="foreBtn" title="Text color (applies to selected text)">
        <span style="font-weight:600;">A</span>
        <span class="swatch" id="foreSwatch"></span>
      </button>
      <button class="fmt-btn color-btn" id="backBtn" title="Highlight color (applies to selected text)">
        <span class="hl-chip" id="backChip">abc</span>
        <span class="swatch" id="backSwatch" style="background:#fde047;"></span>
      </button>
    </div>

    <div class="control">
      <button class="fmt-btn align-btn" data-align="justifyLeft" title="Align left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="2" y1="3.5" x2="14" y2="3.5"/><line x1="2" y1="8" x2="9" y2="8"/><line x1="2" y1="12.5" x2="12" y2="12.5"/>
        </svg>
      </button>
      <button class="fmt-btn align-btn" data-align="justifyCenter" title="Center text">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="2" y1="3.5" x2="14" y2="3.5"/><line x1="4.5" y1="8" x2="11.5" y2="8"/><line x1="3" y1="12.5" x2="13" y2="12.5"/>
        </svg>
      </button>
      <button class="fmt-btn align-btn" data-align="justifyRight" title="Align right">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="2" y1="3.5" x2="14" y2="3.5"/><line x1="7" y1="8" x2="14" y2="8"/><line x1="4" y1="12.5" x2="14" y2="12.5"/>
        </svg>
      </button>
    </div>

    <div class="spacer"></div>

    <button class="panes-btn" id="panesBtn" title="Add panes: split the screen and flow text across columns">
      ⊞ Panes <span class="count" id="panesCount">1</span>
    </button>

    <button class="download-btn" id="findBtn" title="Find & Replace (Ctrl+F)">🔍 Find</button>
    <button class="download-btn" id="printBtn" title="Print the document (Ctrl+P)">🖨 Print</button>
    <button class="download-btn" id="saveBtn" title="Save with the file dialog (HTML keeps all formatting)">💾 Save As</button>
    <button class="download-btn" id="resetBtn" title="Clear the document and restore default font, size and panes">⟲ Reset</button>
    <button class="download-btn" id="downloadTxt" title="Download as plain text">⬇ .txt</button>
    <button class="download-btn" id="downloadHtml" title="Download as HTML (keeps formatting)">⬇ .html</button>

    <span class="status" id="status">Saved</span>

    <button class="theme-btn" id="themeToggle" title="Toggle night theme">
      <span class="icon" id="themeIcon">🌙</span>
      <span id="themeLabel">Night</span>
    </button>
  </div>

  <div class="editor-wrap">
    <div class="editor" id="editor" contenteditable="true" data-placeholder="Start typing…" spellcheck="true"></div>
    <div class="statusbar">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 characters</span>
    </div>
    <span class="loading-ind" id="loadingInd" title="Working…">⏳ Loading…</span>
  </div>

  <!-- Custom color panel -->
  <div class="color-panel" id="colorPanel" hidden>
    <div class="swatch-grid" id="swatchGrid"></div>
    <div class="panel-footer">
      <div class="panel-preview">
        <span class="preview-chip" id="previewChip"></span>
        <span id="panelMode">Text color</span>
      </div>
      <input type="color" id="customColor" value="#e11d48" title="Pick a custom color">
      <button id="colorCancelBtn">Cancel</button>
      <button class="apply-btn" id="colorApplyBtn">Apply</button>
    </div>
    <div class="panel-hint" id="panelHint" hidden>Select some text first, then click Apply.</div>
  </div>

  <!-- Find & Replace panel -->
  <div class="find-panel" id="findPanel" hidden>
    <div class="find-head">
      <span>Find &amp; Replace</span>
      <button class="find-close" id="findClose" title="Close (Esc)">&times;</button>
    </div>
    <div class="find-row">
      <input type="text" id="findInput" placeholder="Find…" autocomplete="off" spellcheck="false">
      <span class="find-count" id="findCount">0/0</span>
      <button class="find-nav-btn" id="findPrev" title="Previous (Shift+Enter)">▲</button>
      <button class="find-nav-btn" id="findNext" title="Next (Enter)">▼</button>
    </div>
    <div class="find-row">
      <input type="text" id="replaceInput" placeholder="Replace with…" autocomplete="off" spellcheck="false">
      <button class="find-act-btn" id="replaceBtn" title="Replace the current match">Replace</button>
      <button class="find-act-btn primary" id="replaceAllBtn" title="Replace every match">All</button>
    </div>
    <div class="find-meta">
      <label><input type="checkbox" id="findCase"> Match case</label>
      <span>Enter = next · Shift+Enter = prev</span>
    </div>
  </div>

<script>
(function () {
  const editor      = document.getElementById('editor');
  const fontFamily  = document.getElementById('fontFamily');
  const fontSize    = document.getElementById('fontSize');
  const sizeValue   = document.getElementById('sizeValue');
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon   = document.getElementById('themeIcon');
  const themeLabel  = document.getElementById('themeLabel');
  const status      = document.getElementById('status');
  const boldBtn     = document.getElementById('boldBtn');
  const italicBtn   = document.getElementById('italicBtn');
  const underlineBtn = document.getElementById('underlineBtn');
  const strikeBtn    = document.getElementById('strikeBtn');
  const alignBtns    = Array.prototype.slice.call(document.querySelectorAll('.align-btn'));
  const undoBtn      = document.getElementById('undoBtn');
  const redoBtn      = document.getElementById('redoBtn');
  const panesBtn     = document.getElementById('panesBtn');
  const panesCount   = document.getElementById('panesCount');
  const foreBtn      = document.getElementById('foreBtn');
  const backBtn      = document.getElementById('backBtn');
  const foreSwatch   = document.getElementById('foreSwatch');
  const backSwatch   = document.getElementById('backSwatch');
  const backChip     = document.getElementById('backChip');
  const colorPanel   = document.getElementById('colorPanel');
  const swatchGrid   = document.getElementById('swatchGrid');
  const previewChip  = document.getElementById('previewChip');
  const panelMode    = document.getElementById('panelMode');
  const panelHint    = document.getElementById('panelHint');
  const customColor  = document.getElementById('customColor');
  const applyBtn     = document.getElementById('colorApplyBtn');
  const cancelBtn    = document.getElementById('colorCancelBtn');
  const wordCountEl  = document.getElementById('wordCount');
  const charCountEl = document.getElementById('charCount');

  document.execCommand('styleWithCSS', false, false);

  const STORAGE_KEY = 'simpleEditor.settings';

  var panes = 1; // 1 = single page, 2-4 = split panes
  var defaultFont = fontFamily.value; // editor-wide font (used when nothing is selected)
  var defaultSize = fontSize.value;   // editor-wide size (used when nothing is selected)

  function applyFont() {
    editor.style.fontFamily = defaultFont;
    editor.style.fontSize = defaultSize + 'px';
    sizeValue.textContent = fontSize.value + 'px';
  }

  // Size changes (slider or wheel) follow the same rules as the font family:
  // word-highlights -> every occurrence; selection -> only that text; else -> editor default
  function onSizeChanged() {
    var px = fontSize.value + 'px';
    sizeValue.textContent = px;
    if (currentMarkCount() > 1) {
      applyToAllMarks('fontSize', px);
    } else if (savedRange && !savedRange.collapsed) {
      applySizeToRange(px);
    } else {
      defaultSize = fontSize.value;
      applyFont();
    }
    save();
  }

  function applySizeToRange(px) {
    // If the range already covers one whole element (the span we wrapped on the
    // previous slider step), restyle it in place instead of nesting another span
    var sc = savedRange.startContainer;
    if (sc === savedRange.endContainer && sc.nodeType === 1 &&
        savedRange.startOffset === 0 && savedRange.endOffset === sc.childNodes.length && sc.style) {
      sc.style.fontSize = px;
      save();
      return;
    }
    applyStyleToRange('fontSize', px);
  }

  function applyPanes() {
    if (panes > 1) {
      editor.classList.add('multi');
      editor.style.columnCount = panes;
    } else {
      editor.classList.remove('multi');
      editor.style.columnCount = '';
    }
    panesCount.textContent = panes;
    panesBtn.classList.toggle('active', panes > 1);
  }

  function applyTheme(dark) {
    document.body.classList.toggle('dark', dark);
    themeIcon.textContent  = dark ? '☀️' : '🌙';
    themeLabel.textContent = dark ? 'Day' : 'Night';
  }

  let saveTimer = null;
  function save() {
    status.textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        html: cleanEditorHtml(), // strip transient Find highlights before persisting
        font: defaultFont,
        size: defaultSize,
        panes: panes,
        dark: document.body.classList.contains('dark')
      }));
      status.textContent = 'Saved';
    }, 400);
  }

  function load() {
    let data = {};
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) {}
    if (data.html) editor.innerHTML = data.html;
    else if (data.text) editor.textContent = data.text; // migrate from plain-text version
    if (data.font) {
      fontFamily.value = data.font;
      if (fontFamily.value !== data.font) {
        // Saved font is a system font not yet in the list: keep it selectable
        const opt = document.createElement('option');
        opt.value = data.font;
        opt.textContent = data.font.replace(/"/g, '').split(',')[0];
        opt.id = 'savedFontOpt';
        fontFamily.appendChild(opt);
        fontFamily.value = data.font;
      }
    }
    defaultFont = fontFamily.value || defaultFont;
    if (data.size) fontSize.value = data.size;
    defaultSize = fontSize.value;
    if (data.panes) panes = Math.min(4, Math.max(1, parseInt(data.panes, 10) || 1));
    applyTheme(Boolean(data.dark));
    applyFont();
    applyPanes();
    updateCounts();
  }

  // ---- System font enumeration (Local Font Access API: Chrome / Edge) ----
  var scanFontsBtn = document.getElementById('scanFontsBtn');
  var loadingInd = document.getElementById('loadingInd');
  var FONTS_CACHE_KEY = 'simpleEditor.fonts'; // cached family names, survives restarts
  var pendingSystemFonts = null; // cached families awaiting LAZY build (avoids the startup rebuild)

  // Turn the busy feedback on/off: hourglass over the whole page + the blinking
  // "Loading" chip next to the color buttons. Used by any long-running op.
  function setBusy(on) {
    document.body.classList.toggle('fontscan-busy', !!on);
    if (loadingInd) loadingInd.classList.toggle('show', !!on);
  }

  function cacheFonts(families) {
    try { localStorage.setItem(FONTS_CACHE_KEY, JSON.stringify(families)); } catch (e) {}
  }

  function readFontsCache() {
    try {
      var list = JSON.parse(localStorage.getItem(FONTS_CACHE_KEY));
      return Array.isArray(list) && list.length ? list : null;
    } catch (e) { return null; }
  }

  // ---- Full-catalog cache in IndexedDB ----
  // localStorage only keeps the compact, deduped FAMILY list. To enlist the
  // ENTIRE font set (every face/style/full/PostScript name) — which can be
  // humongous for a huge library — we persist it to IndexedDB, whose storage
  // quota is far larger than localStorage's ~5MB. The family list stays in
  // localStorage purely so the dropdown can hydrate instantly on next load.
  var FONTDB_NAME = 'simpleEditor.fontdb', FONTDB_STORE = 'kv';
  var allFaces = null; // in-memory mirror of the full catalog for this session

  function idbWrite(value) {
    try {
      var req = indexedDB.open(FONTDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(FONTDB_STORE); };
      req.onsuccess = function () {
        var db = req.result;
        var tx = db.transaction(FONTDB_STORE, 'readwrite');
        tx.objectStore(FONTDB_STORE).put(value, 'faces');
        tx.oncomplete = function () { db.close(); };
      };
      req.onerror = function () { /* IDB unavailable; localStorage families still work */ };
    } catch (e) { /* indexedDB missing (private mode etc.) — degrade silently */ }
  }

  function idbReadFaces(cb) {
    try {
      var req = indexedDB.open(FONTDB_NAME, 1);
      req.onupgradeneeded = function () { req.result.createObjectStore(FONTDB_STORE); };
      req.onsuccess = function () {
        var db = req.result;
        var get = db.transaction(FONTDB_STORE, 'readonly').objectStore(FONTDB_STORE).get('faces');
        get.onsuccess = function () { cb(get.result || null); db.close(); };
        get.onerror = function () { cb(null); db.close(); };
      };
      req.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }

  function populateSystemFonts(families) {
    var group = document.getElementById('sysFontGroup');
    if (!group) {
      group = document.createElement('optgroup');
      group.id = 'sysFontGroup';
      group.label = 'System fonts';
      fontFamily.appendChild(group);
    }
    var saved = defaultFont;
    var frag = document.createDocumentFragment();
    families.forEach(function (f) {
      var cssVal = '"' + f + '", sans-serif';
      var opt = document.createElement('option');
      opt.value = cssVal;
      opt.textContent = f;
      opt.style.fontFamily = cssVal; // preview each option in its own typeface
      frag.appendChild(opt);
    });
    group.innerHTML = '';
    group.appendChild(frag); // one batched insert instead of thousands of reflows
    // If the current font matches a discovered family, sync the dropdown to it
    var match = families.filter(function (f) {
      return saved && saved.toLowerCase().indexOf(f.toLowerCase()) !== -1;
    })[0];
    if (match) {
      fontFamily.value = '"' + match + '", sans-serif';
      defaultFont = fontFamily.value;
      applyFont();
    }
  }

  // Build the (potentially enormous) System fonts list only when it's first
  // needed, so opening the app stays instant. After the first Font-menu open,
  // the list is fully built and cached in the DOM for the rest of the session.
  function ensureSystemFontsLoaded() {
    if (!pendingSystemFonts) return;
    var list = pendingSystemFonts;
    pendingSystemFonts = null;
    populateSystemFonts(list);
  }
  fontFamily.addEventListener('mousedown', ensureSystemFontsLoaded);
  fontFamily.addEventListener('focus', ensureSystemFontsLoaded);

  scanFontsBtn.addEventListener('click', function () {
    if (!window.queryLocalFonts) {
      status.textContent = 'Font scan not supported here';
      setTimeout(function () { status.textContent = 'Saved'; }, 2500);
      return;
    }
    status.textContent = 'Scanning fonts…';
    scanFontsBtn.textContent = '🔤 …';
    setBusy(true); // hourglass + blinking Loading chip until the scan settles
    window.queryLocalFonts().then(function (fonts) {
      // Let the Loading chip paint (and the permission prompt settle) before the
      // heavy dedupe/populate work blocks the main thread
      requestAnimationFrame(function () {
      var seen = {}, families = [];
      fonts.forEach(function (f) {
        if (!seen[f.family]) { seen[f.family] = 1; families.push(f.family); }
      });
      families.sort(function (a, b) { return a.localeCompare(b); });
      populateSystemFonts(families);
      pendingSystemFonts = null; // freshly built from the scan; nothing to lazy-load
      cacheFonts(families); // next launch loads instantly from cache
      // Enlist the ENTIRE catalog (every face, not just deduped families) into
      // IndexedDB — kept regardless of how large it gets.
      allFaces = fonts.map(function (f) {
        return { family: f.family, style: f.style, fullName: f.fullName, postscriptName: f.postscriptName };
      });
      idbWrite(allFaces);
      scanFontsBtn.textContent = '🔤 ' + families.length;
      scanFontsBtn.classList.add('scanned');
      scanFontsBtn.title = families.length + ' families (' + allFaces.length + ' faces) cached — click to rescan after installing new fonts';
      status.textContent = 'Saved';
      setBusy(false);
      });
    }).catch(function () {
      setBusy(false);
      var cached = readFontsCache();
      scanFontsBtn.textContent = cached ? '🔤 ' + cached.length : '🔤 System';
      status.textContent = 'Font access denied';
      scanFontsBtn.title = 'Permission was denied — allow font access in the browser prompt, then try again';
      setTimeout(function () { status.textContent = 'Saved'; }, 2500);
    });
  });

  function updateCounts() {
    const text = editor.textContent || '';
    const words = text.trim() ? text.trim().split(/\s+/).length : 0;
    wordCountEl.textContent = words + (words === 1 ? ' word' : ' words');
    charCountEl.textContent = text.length + ' characters';
  }

  function updateFmtButtons() {
    boldBtn.classList.toggle('active', document.queryCommandState('bold'));
    italicBtn.classList.toggle('active', document.queryCommandState('italic'));
    underlineBtn.classList.toggle('active', document.queryCommandState('underline'));
    strikeBtn.classList.toggle('active', document.queryCommandState('strikeThrough'));
    alignBtns.forEach(function (btn) {
      btn.classList.toggle('active', document.queryCommandState(btn.dataset.align));
    });
  }

  // Map execCommand names to the CSS property/value that reproduces them on a span
  var fmtStyleMap = {
    bold: ['fontWeight', 'bold'],
    italic: ['fontStyle', 'italic'],
    underline: ['textDecoration', 'underline'],
    strikeThrough: ['textDecoration', 'line-through']
  };

  function applyFormat(cmd) {
    // If the selection sits inside active word-highlights, format EVERY occurrence
    if (fmtStyleMap[cmd] && currentMarkCount() > 1) {
      applyToAllMarks(fmtStyleMap[cmd][0], fmtStyleMap[cmd][1]);
      save();
      return;
    }
    editor.focus();
    document.execCommand(cmd, false, null);
    updateFmtButtons();
    save();
  }

  function download(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  // ---- Recently used fonts: pinned to the top of the dropdown ----
  var RECENT_FONTS_KEY = 'simpleEditor.recentFonts';

  function readRecentFonts() {
    try {
      var list = JSON.parse(localStorage.getItem(RECENT_FONTS_KEY));
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }

  function renderRecentFonts() {
    var list = readRecentFonts();
    var group = document.getElementById('recentFontGroup');
    if (!group) {
      group = document.createElement('optgroup');
      group.id = 'recentFontGroup';
      group.label = '\u2605 Recently used';
      fontFamily.insertBefore(group, fontFamily.firstChild);
    }
    group.innerHTML = '';
    list.forEach(function (item) {
      var opt = document.createElement('option');
      opt.value = item.value;
      opt.textContent = item.label;
      opt.style.fontFamily = item.value; // preview in its own typeface
      group.appendChild(opt);
    });
  }

  function recordFontUsage(value) {
    if (!value) return;
    var label = value.replace(/"/g, '').split(',')[0].trim();
    var list = readRecentFonts().filter(function (i) { return i.value !== value; });
    list.unshift({ value: value, label: label }); // most recently used first
    if (list.length > 8) list.length = 8;
    try { localStorage.setItem(RECENT_FONTS_KEY, JSON.stringify(list)); } catch (e) {}
    renderRecentFonts();
    fontFamily.value = value; // group rebuild can drop the selection
  }

  fontFamily.addEventListener('change', function () {
    recordFontUsage(fontFamily.value);
    var count = currentMarkCount();
    if (count > 1) {
      // Word-highlights active: apply the new font to every occurrence
      applyToAllMarks('fontFamily', fontFamily.value);
    } else if (savedRange && !savedRange.collapsed) {
      // Selection exists: change font ONLY for the selected text
      applyStyleToRange('fontFamily', fontFamily.value);
      editor.focus(); // dropdown stole focus; give the selection back
    } else {
      // No selection: change the editor-wide default font
      defaultFont = fontFamily.value;
      applyFont();
    }
    save();
  });

  // NOTE: a native <select> opens its list in an OS modal loop, so the page
  // can't repaint a custom cursor or the Loading chip while that popup is up.
  // Busy feedback is therefore surfaced around the async font *scan* instead
  // (see setBusy), which is the operation that can actually stall the app.
  fontSize.addEventListener('input', onSizeChanged);
  themeToggle.addEventListener('click', function () {
    applyTheme(!document.body.classList.contains('dark'));
    save();
  });
  editor.addEventListener('input', function () { updateCounts(); save(); });
  editor.addEventListener('keyup', updateFmtButtons);
  editor.addEventListener('mouseup', updateFmtButtons);

  // Keep the editor selection alive when clicking the format buttons
  [boldBtn, italicBtn, underlineBtn, strikeBtn].concat(alignBtns).forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  boldBtn.addEventListener('click', function () { applyFormat('bold'); });
  italicBtn.addEventListener('click', function () { applyFormat('italic'); });
  underlineBtn.addEventListener('click', function () { applyFormat('underline'); });
  strikeBtn.addEventListener('click', function () { applyFormat('strikeThrough'); });
  alignBtns.forEach(function (btn) {
    btn.addEventListener('click', function () { applyFormat(btn.dataset.align); });
  });

  // ---- Text & highlight color ----
  // Clicking a toolbar button deselects the text, so remember the selection
  // when the button is pressed and restore it when the color comes back.
  var savedRange = null;

  function saveSelection() {
    var sel = window.getSelection();
    if (sel.rangeCount && !sel.isCollapsed && editor.contains(sel.getRangeAt(0).commonAncestorContainer)) {
      savedRange = sel.getRangeAt(0).cloneRange();
    }
    // Note: does NOT clear savedRange — the selectionchange tracker below owns that,
    // because clicking toolbar controls (select dropdown etc.) can drop the live selection
  }

  // Keep savedRange in sync with the editor selection.
  // IMPORTANT: a collapsed selection only clears savedRange when the EDITOR has
  // focus — clicking the font dropdown/slider also collapses the selection, but
  // focus is on the control, and that must NOT erase the selection we apply to.
  document.addEventListener('selectionchange', function () {
    var sel = window.getSelection();
    if (!sel.rangeCount) return;
    var r = sel.getRangeAt(0);
    if (!editor.contains(r.commonAncestorContainer)) return;
    if (!r.collapsed) {
      savedRange = r.cloneRange();
    } else if (document.activeElement === editor) {
      savedRange = null;
    }
  });

  function restoreSelection() {
    editor.focus();
    if (savedRange) {
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
    }
  }

  // Apply a style directly to the saved selection via DOM.
  // (execCommand-based coloring silently fails while other controls hold focus,
  //  so we wrap the range ourselves — deterministic for colors AND fonts.)
  function applyStyleToRange(styleProp, value) {
    if (!savedRange) return;
    var span = document.createElement('span');
    span.style[styleProp] = value;
    try {
      savedRange.surroundContents(span);
    } catch (e) {
      // Range crosses element boundaries: extract and wrap instead
      var frag = savedRange.extractContents();
      span.appendChild(frag);
      savedRange.insertNode(span);
    }
    // Keep the recolored text selected so another palette click restacks on it
    var r = document.createRange();
    r.selectNodeContents(span);
    savedRange = r;
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
    save();
  }

  // preventDefault on mousedown keeps focus + selection in the editor alive
  foreBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  backBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });

  // ---- Custom color panel with Apply button ----
  var colorMode = 'fore';
  var selectedColor = '#e11d48';

  function hslToHex(h, s, l) {
    var a = s * Math.min(l, 1 - l);
    var f = function (n) {
      var k = (n + h / 30) % 12;
      var c = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
      return Math.round(255 * c).toString(16).padStart(2, '0');
    };
    return '#' + f(0) + f(8) + f(4);
  }

  (function buildSwatches() {
    var colors = [];
    [0.2, 0.35, 0.5, 0.65, 0.8].forEach(function (l) {
      for (var h = 0; h < 360; h += 30) colors.push(hslToHex(h, 0.85, l));
    });
    for (var i = 0; i <= 11; i++) colors.push(hslToHex(0, 0, i / 11)); // grayscale row
    colors.forEach(function (c) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.background = c;
      cell.title = c;
      cell.addEventListener('click', function () { setSelectedColor(c); });
      swatchGrid.appendChild(cell);
    });
  })();

  function setSelectedColor(c) {
    selectedColor = c;
    previewChip.style.background = c;
    if (/^#[0-9a-f]{6}$/i.test(c)) customColor.value = c;
    Array.prototype.forEach.call(swatchGrid.children, function (el) {
      el.classList.toggle('selected', el.title.toLowerCase() === c.toLowerCase());
    });
  }

  function openPanel(mode, btn) {
    saveSelection();
    colorMode = mode;
    panelMode.textContent = mode === 'fore' ? 'Text color' : 'Highlight color';
    setSelectedColor(selectedColor);
    colorPanel.hidden = false;
    var rect = btn.getBoundingClientRect();
    var left = Math.min(rect.left, window.innerWidth - colorPanel.offsetWidth - 10);
    colorPanel.style.left = Math.max(10, left) + 'px';
    colorPanel.style.top = (rect.bottom + 6) + 'px';
    countTargetMarks();
    var hasSel = (!!savedRange && !savedRange.collapsed) || markCount > 1;
    applyBtn.disabled = !hasSel;
    if (markCount > 1) {
      panelHint.textContent = 'Will color all ' + markCount + ' selected (blinking) occurrences.';
      panelHint.hidden = false;
    } else if (!hasSel) {
      panelHint.textContent = 'Select some text first, then click Apply.';
      panelHint.hidden = false;
    } else {
      panelHint.hidden = true;
    }
  }

  function closePanel() { colorPanel.hidden = true; }

  // When the selection sits inside the blue word-highlights, Apply should
  // recolor EVERY occurrence, not just the selected one
  var markCount = 0;

  function countTargetMarks() {
    markCount = 0;
    // The blinking highlights ARE a standing selection: while they exist, every
    // change targets all occurrences — even if the caret has moved since.
    // Exception: an explicit multi-word block drag overrides and wins.
    if (savedRange && !savedRange.collapsed && /\s/.test(savedRange.toString())) return;
    markCount = editor.querySelectorAll('mark.word-hl').length;
  }

  function applyToAllMarks(styleProp, value) {
    var marks = editor.querySelectorAll('mark.word-hl');
    // Remember which occurrence held the selection so we can restore it after
    Array.prototype.forEach.call(marks, function (mark) {
      var r = document.createRange();
      r.selectNodeContents(mark);
      var span = document.createElement('span');
      span.style[styleProp] = value;
      try { r.surroundContents(span); } catch (e) {}
    });
    if (savedRange) {
      var n = savedRange.startContainer;
      var el = n.nodeType === 3 ? n.parentElement : n;
      var anchorMark = el && el.closest ? el.closest('mark.word-hl') : null;
      if (anchorMark) {
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }
    save();
  }

  // Shared helper: re-check the live selection and count highlighted occurrences
  function currentMarkCount() {
    saveSelection();
    countTargetMarks();
    return markCount;
  }

  // Keep the editor's selection alive while clicking around inside the panel
  colorPanel.addEventListener('mousedown', function (e) {
    if (e.target !== customColor) e.preventDefault();
  });

  foreBtn.addEventListener('click', function () { openPanel('fore', foreBtn); });
  backBtn.addEventListener('click', function () { openPanel('back', backBtn); });

  customColor.addEventListener('input', function () { setSelectedColor(customColor.value); });
  cancelBtn.addEventListener('click', closePanel);

  applyBtn.addEventListener('click', function () {
    saveSelection(); // refresh from the live selection if one still exists
    countTargetMarks();
    var prop = 'color', swatchFn = function () { foreSwatch.style.background = selectedColor; };
    if (colorMode === 'back') {
      prop = 'backgroundColor';
      swatchFn = function () {
        backSwatch.style.background = selectedColor;
        backChip.style.background = selectedColor;
      };
    }
    swatchFn();
    if (markCount > 1) {
      applyToAllMarks(prop, selectedColor); // the blinking set is the target
    } else if (savedRange && !savedRange.collapsed) {
      applyStyleToRange(prop, selectedColor);
    }
    closePanel();
    editor.focus(); // keep the selection active for the next change
  });

  // Close the panel when clicking anywhere outside it
  document.addEventListener('mousedown', function (e) {
    if (colorPanel.hidden) return;
    if (!colorPanel.contains(e.target) && !foreBtn.contains(e.target) && !backBtn.contains(e.target)) {
      closePanel();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !colorPanel.hidden) closePanel();
  });

  function runHistory(cmd) {
    editor.focus();
    document.execCommand(cmd, false, null);
    updateCounts();
    save();
  }

  undoBtn.addEventListener('click', function () { runHistory('undo'); });
  redoBtn.addEventListener('click', function () { runHistory('redo'); });

  panesBtn.addEventListener('click', function () {
    panes = panes % 4 + 1; // cycles 1 → 2 → 3 → 4 → 1
    applyPanes();
    save();
  });

  document.getElementById('downloadTxt').addEventListener('click', function () {
    download('document.txt', editor.innerText, 'text/plain;charset=utf-8');
  });

  function buildHtmlExport() {
    return '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>Document</title>\n'
      + '<style>body{font-family:' + defaultFont + ';font-size:' + defaultSize + 'px;line-height:1.65;margin:40px auto;max-width:720px;}</style>\n'
      + '</head>\n<body>\n' + cleanEditorHtml() + '\n</body>\n</html>';
  }

  // ---- Print: native print dialog, print CSS shows only the document ----
  document.getElementById('printBtn').addEventListener('click', function () {
    closePanel();
    window.print();
  });

  // ---- Save As: native file dialog (File System Access API) ----
  document.getElementById('saveBtn').addEventListener('click', function () {
    var html = buildHtmlExport();
    var txt = editor.innerText;
    if (!window.showSaveFilePicker) {
      // Firefox/Safari: fall back to a regular download
      download('document.html', html, 'text/html;charset=utf-8');
      return;
    }
    window.showSaveFilePicker({
      suggestedName: 'document.html',
      startIn: 'documents',
      types: [
        { description: 'HTML document (keeps formatting)', accept: { 'text/html': ['.html'] } },
        { description: 'Plain text', accept: { 'text/plain': ['.txt'] } }
      ]
    }).then(function (handle) {
      var content = /\.txt$/i.test(handle.name) ? txt : html;
      return handle.createWritable().then(function (writable) {
        return writable.write(content).then(function () { return writable.close(); });
      });
    }).then(function () {
      status.textContent = 'Saved to file';
      setTimeout(function () { status.textContent = 'Saved'; }, 2000);
    }).catch(function (err) {
      if (err && err.name === 'AbortError') return; // user cancelled the dialog
      download('document.html', html, 'text/html;charset=utf-8'); // real failure -> fallback
    });
  });

  // ---- Reset: clear content + restore default formatting settings ----
  // Two-click inline confirm (native confirm() dialogs can be auto-dismissed
  // on file:// pages, which silently cancelled the old one-click reset)
  var resetBtn = document.getElementById('resetBtn');
  var resetArmed = false;
  var resetTimer = null;
  var resetLabel = '⟲ Reset';

  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    resetBtn.textContent = resetLabel;
    resetBtn.classList.remove('armed');
  }

  function doReset() {
    clearTimeout(saveTimer); // stop a pending auto-save from restoring old content
    editor.innerHTML = '';
    savedRange = null;
    fontFamily.value = fontFamily.options[0].value;
    fontSize.value = 18;
    defaultFont = fontFamily.value;
    defaultSize = fontSize.value;
    panes = 1;
    applyFont();
    applyPanes();
    updateCounts();
    updateFmtButtons();
    localStorage.removeItem(STORAGE_KEY);
    editor.focus();
  }

  resetBtn.addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = '⚠ Click again to confirm';
      resetBtn.classList.add('armed');
      resetTimer = setTimeout(disarmReset, 3000);
      return;
    }
    disarmReset();
    doReset();
  });
  document.getElementById('downloadHtml').addEventListener('click', function () {
    download('document.html', buildHtmlExport(), 'text/html;charset=utf-8');
  });

  // Keyboard shortcuts: Ctrl+Shift+D theme · Ctrl+S save · Ctrl+F find
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyD') {
      e.preventDefault();
      themeToggle.click();
    }
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyS' && !e.shiftKey) {
      e.preventDefault(); // replace the browser's Save-page dialog with ours
      document.getElementById('saveBtn').click();
    }
    if ((e.ctrlKey || e.metaKey) && e.code === 'KeyF' && !e.shiftKey) {
      e.preventDefault(); // replace the browser's Find bar with ours
      openFind();
    }
    if (e.key === 'Escape') {
      if (!findPanel.hidden) closeFind();
      else clearHighlight();
    }
  });

  // ---- Mouse-wheel zoom over the editor ----
  // Wheel = change font size; Shift+Wheel = scroll the document (sideways in pane mode)
  editor.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (e.shiftKey) {
      if (panes > 1) editor.scrollLeft += e.deltaY;
      else editor.scrollTop += e.deltaY;
      return;
    }
    var step = e.deltaY < 0 ? 1 : -1;
    var size = parseInt(fontSize.value, 10) + step;
    size = Math.min(parseInt(fontSize.max, 10), Math.max(parseInt(fontSize.min, 10), size));
    if (String(size) !== fontSize.value) {
      fontSize.value = size;
      onSizeChanged();
    }
  }, { passive: false });

  // ---- Double-click a word to highlight every occurrence ----
  function escapeRegExp(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function clearHighlight() {
    var marks = editor.querySelectorAll('mark.word-hl');
    if (!marks.length) return;
    Array.prototype.forEach.call(marks, function (m) {
      var parent = m.parentNode;
      while (m.firstChild) parent.insertBefore(m.firstChild, m);
      parent.removeChild(m);
      parent.normalize();
    });
    save();
  }

  function highlightWord(word) {
    clearHighlight();
    if (!/^[\w]+$/.test(word)) return; // plain words only
    var needle = word.toLowerCase();
    var re = new RegExp('\\b' + escapeRegExp(word) + '\\b', 'gi');
    var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
      acceptNode: function (n) {
        return n.nodeValue && n.nodeValue.toLowerCase().indexOf(needle) !== -1
          ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    var found = false;
    nodes.forEach(function (node) {
      var frag = document.createDocumentFragment();
      var text = node.nodeValue, last = 0, m;
      re.lastIndex = 0;
      while ((m = re.exec(text))) {
        if (m.index === re.lastIndex) { re.lastIndex++; continue; }
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var mark = document.createElement('mark');
        mark.className = 'word-hl';
        mark.textContent = m[0];
        frag.appendChild(mark);
        last = m.index + m[0].length;
        found = true;
      }
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
    if (found) save();
  }

  editor.addEventListener('dblclick', function (e) {
    var sel = window.getSelection();
    var word = sel ? sel.toString().trim() : '';
    if (word) highlightWord(word);
    // Wrapping words in <mark> destroyed the native selection —
    // re-select the double-clicked word so tools like the color picker can use it
    var at = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    if (at) {
      var node = at.startContainer;
      var el = node.nodeType === 3 ? node.parentElement : node;
      var mark = el && el.closest ? el.closest('mark.word-hl') : null;
      if (mark) {
        var r = document.createRange();
        r.selectNodeContents(mark);
        sel.removeAllRanges();
        sel.addRange(r);
      }
    }
  });

  // A plain click removes any active word highlight
  editor.addEventListener('click', clearHighlight);

  // ---- Find & Replace ----
  var findBtn        = document.getElementById('findBtn');
  var findPanel      = document.getElementById('findPanel');
  var findInput      = document.getElementById('findInput');
  var replaceInput   = document.getElementById('replaceInput');
  var findCountEl    = document.getElementById('findCount');
  var findCase       = document.getElementById('findCase');
  var findPrevBtn    = document.getElementById('findPrev');
  var findNextBtn    = document.getElementById('findNext');
  var replaceBtn     = document.getElementById('replaceBtn');
  var replaceAllBtn  = document.getElementById('replaceAllBtn');
  var findCloseBtn   = document.getElementById('findClose');
  var findMatches = []; // mark.find-hl elements, in document order
  var findIndex = -1;

  // Return editor HTML with any transient Find highlights unwrapped, so they
  // never leak into localStorage or exported files.
  function cleanEditorHtml() {
    if (!editor.querySelector('mark.find-hl')) return editor.innerHTML;
    var clone = editor.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('mark.find-hl'), function (m) {
      var p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
    });
    return clone.innerHTML;
  }

  function clearFindMarks() {
    var marks = editor.querySelectorAll('mark.find-hl');
    if (!marks.length) return;
    Array.prototype.forEach.call(marks, function (m) {
      var p = m.parentNode;
      while (m.firstChild) p.insertBefore(m.firstChild, m);
      p.removeChild(m);
    });
    editor.normalize();
  }

  function runFind(scroll) {
    clearFindMarks();
    findMatches = [];
    findIndex = -1;
    var q = findInput.value;
    if (!q) { updateFindCount(); return; }
    var re = new RegExp(escapeRegExp(q), findCase.checked ? 'g' : 'gi');
    var nodes = [];
    var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null, false);
    var node;
    while ((node = walker.nextNode())) { if (node.nodeValue) nodes.push(node); }
    nodes.forEach(function (tn) {
      var text = tn.nodeValue, m, spans = [];
      re.lastIndex = 0;
      while ((m = re.exec(text)) !== null) {
        if (!m[0].length) { re.lastIndex++; continue; }
        spans.push({ start: m.index, len: m[0].length });
      }
      // wrap last-to-first so earlier offsets within this node stay valid
      for (var i = spans.length - 1; i >= 0; i--) {
        var mark = document.createElement('mark');
        mark.className = 'find-hl';
        var r = document.createRange();
        r.setStart(tn, spans[i].start);
        r.setEnd(tn, spans[i].start + spans[i].len);
        r.surroundContents(mark);
        findMatches.unshift(mark);
      }
    });
    if (findMatches.length) {
      findIndex = 0;
      setActiveFind();
      if (scroll !== false) scrollActiveFind();
    }
    updateFindCount();
  }

  function updateFindCount() {
    var t = findMatches.length;
    findCountEl.textContent = t ? (findIndex + 1) + '/' + t : '0/0';
  }

  function setActiveFind() {
    Array.prototype.forEach.call(editor.querySelectorAll('mark.find-hl'), function (m) {
      m.classList.remove('active');
    });
    if (findMatches[findIndex]) findMatches[findIndex].classList.add('active');
  }

  function scrollActiveFind() {
    var el = findMatches[findIndex];
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function gotoFind(step) {
    if (!findMatches.length) { runFind(true); return; }
    findIndex = (findIndex + step + findMatches.length) % findMatches.length;
    setActiveFind();
    scrollActiveFind();
    updateFindCount();
  }

  function replaceCurrent() {
    if (!findMatches.length) return;
    var el = findMatches[findIndex] || findMatches[0];
    el.parentNode.replaceChild(document.createTextNode(replaceInput.value), el);
    editor.normalize();
    var keep = findIndex;
    runFind(true);
    if (findMatches.length) {
      findIndex = Math.min(keep, findMatches.length - 1);
      setActiveFind(); scrollActiveFind(); updateFindCount();
    }
    save();
  }

  function replaceAll() {
    var q = findInput.value;
    if (!q) return;
    var n = findMatches.length;
    clearFindMarks();
    var re = new RegExp(escapeRegExp(q), findCase.checked ? 'g' : 'gi');
    var walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], node;
    while ((node = walker.nextNode())) nodes.push(node);
    nodes.forEach(function (tn) {
      if (!tn.nodeValue) return;
      var nt = tn.nodeValue.replace(re, replaceInput.value);
      if (nt !== tn.nodeValue) tn.nodeValue = nt;
    });
    editor.normalize();
    runFind(true);
    save();
    status.textContent = 'Replaced ' + n;
    setTimeout(function () { status.textContent = 'Saved'; }, 2000);
  }

  function openFind() {
    findPanel.hidden = false;
    findInput.focus();
    findInput.select();
    runFind(true);
  }

  function closeFind() {
    clearFindMarks();
    findMatches = []; findIndex = -1;
    findPanel.hidden = true;
    editor.focus();
  }

  findBtn.addEventListener('click', function () { if (findPanel.hidden) openFind(); else closeFind(); });
  findCloseBtn.addEventListener('click', closeFind);
  var findDebounce = null;
  findInput.addEventListener('input', function () {
    clearTimeout(findDebounce);
    findDebounce = setTimeout(function () { runFind(true); }, 180);
  });
  findInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); gotoFind(e.shiftKey ? -1 : 1); }
  });
  replaceInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); replaceAll(); }
  });
  findCase.addEventListener('change', function () { runFind(true); });
  findPrevBtn.addEventListener('click', function () { gotoFind(-1); });
  findNextBtn.addEventListener('click', function () { gotoFind(1); });
  replaceBtn.addEventListener('click', replaceCurrent);
  replaceAllBtn.addEventListener('click', replaceAll);

  load();

  // Show previously used fonts at the top of the list from the start
  renderRecentFonts();

  // Hydrate the font list from cache immediately — no scan, no permission prompt,
  // even with thousands of installed families
  (function hydrateFontCache() {
    var cached = readFontsCache();
    if (!cached) return;
    // Don't rebuild the huge option list at startup — stash it and build lazily
    // on the first Font-menu open, so every subsequent app open is instant.
    pendingSystemFonts = cached;
    scanFontsBtn.textContent = '🔤 ' + cached.length;
    scanFontsBtn.classList.add('scanned');
    scanFontsBtn.title = cached.length + ' families cached — the list fills the first time you open the Font menu';
    // Restore the ENTIRE face catalog (if stored) into memory for this session
    idbReadFaces(function (faces) {
      if (Array.isArray(faces) && faces.length) {
        allFaces = faces;
        scanFontsBtn.title = cached.length + ' families (' + faces.length + ' faces) cached — the list fills the first time you open the Font menu';
      }
    });
  })();

  editor.focus();
})();
</script>
</body>
</html>
